<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gartenxclusiv — Einsatzplanung</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

:root {
  --bg:       #0d1117;
  --surface:  #161b22;
  --surface2: #1c2128;
  --border:   #30363d;
  --gold:     #c8a84b;
  --gold-dim: #7a6329;
  --green:    #3fb950;
  --green-dim:#1a4a22;
  --blue:     #58a6ff;
  --blue-dim: #1a3a5c;
  --red:      #f85149;
  --red-dim:  #5c1a1a;
  --amber:    #f59f00;
  --amber-dim:#5c3d00;
  --text:     #e6edf3;
  --muted:    #7d8590;
  --muted2:   #484f58;
  --today:    rgba(200,168,75,0.12);
  --radius:   8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── TOPBAR ── */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
  height: 56px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}

.logo-mark {
  width: 32px;
  height: 32px;
  background: var(--gold);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 12px;
  color: #0d1117;
  letter-spacing: -0.5px;
  flex-shrink: 0;
}

.logo-text {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.logo-sub {
  font-size: 10px;
  color: var(--muted);
  font-weight: 400;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.topbar-sep { flex: 1; }

.week-nav {
  display: flex;
  align-items: center;
  gap: 8px;
}

.week-nav-btn {
  width: 30px;
  height: 30px;
  border-radius: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.15s;
}

.week-nav-btn:hover { background: var(--border); color: var(--text); }

.week-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  min-width: 140px;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
}

.view-btns {
  display: flex;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

.view-btn {
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  border: none;
  background: none;
  transition: all 0.15s;
}

.view-btn.active { background: var(--gold); color: #0d1117; font-weight: 700; }
.view-btn:hover:not(.active) { color: var(--text); }

.btn-icon {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  font-size: 12px;
  font-weight: 500;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}

.btn-icon:hover { border-color: var(--gold); color: var(--gold); }

.sync-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 6px var(--green);
  animation: pulse 2s infinite;
  flex-shrink: 0;
}

@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ── STATS BAR ── */
.stats-bar {
  display: flex;
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
}

.stat {
  flex: 1;
  padding: 12px 20px;
  background: var(--surface);
  display: flex;
  align-items: center;
  gap: 12px;
}

.stat-icon {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.stat-icon.green { background: var(--green-dim); }
.stat-icon.blue  { background: var(--blue-dim); }
.stat-icon.red   { background: var(--red-dim); }
.stat-icon.gold  { background: rgba(200,168,75,0.15); }

.stat-val { font-size: 22px; font-weight: 700; line-height: 1; }
.stat-val.green { color: var(--green); }
.stat-val.blue  { color: var(--blue); }
.stat-val.red   { color: var(--red); }
.stat-val.gold  { color: var(--gold); }
.stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* ── MAIN LAYOUT ── */
.main { display: flex; height: calc(100vh - 56px - 61px); }

.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 12px 0;
}

.sidebar-section {
  padding: 8px 16px 4px;
  font-size: 10px;
  font-weight: 700;
  color: var(--muted2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.filter-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 16px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all 0.12s;
}

.filter-item:hover { color: var(--text); background: var(--surface2); }
.filter-item.active { color: var(--gold); border-left-color: var(--gold); background: rgba(200,168,75,0.06); }

.filter-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.filter-count {
  margin-left: auto;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  background: var(--surface2);
  border-radius: 10px;
  padding: 1px 6px;
  color: var(--muted);
}

/* ── GANTT ── */
.gantt-wrap {
  flex: 1;
  overflow: auto;
  background: var(--bg);
  position: relative;
}

.gantt-container {
  min-width: 900px;
}

/* Header */
.gantt-header {
  display: grid;
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.gantt-header-name {
  padding: 10px 16px;
  font-size: 11px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-right: 1px solid var(--border);
  display: flex;
  align-items: center;
}

.gantt-header-days {
  display: flex;
  border-right: 1px solid var(--border);
}

.gantt-day-header {
  flex: 1;
  padding: 6px 4px;
  text-align: center;
  border-right: 0.5px solid var(--border);
  cursor: default;
}

.gantt-day-header.today {
  background: var(--today);
}

.gantt-day-header.weekend {
  background: rgba(255,255,255,0.02);
}

.gantt-day-num {
  font-size: 13px;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text);
}

.gantt-day-name {
  font-size: 9px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-top: 1px;
}

.gantt-day-header.today .gantt-day-num {
  color: var(--gold);
}

.gantt-day-header.weekend .gantt-day-num {
  color: var(--muted2);
}

/* Rows */
.gantt-row {
  display: grid;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
}

.gantt-row:hover { background: rgba(255,255,255,0.02); }
.gantt-row.highlighted { background: rgba(200,168,75,0.06); }

.gantt-name {
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-right: 1px solid var(--border);
  cursor: pointer;
  min-height: 52px;
}

.gantt-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--gold-dim);
  border: 1.5px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 700;
  color: var(--gold);
  flex-shrink: 0;
}

.gantt-name-text {
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.gantt-name-sub {
  font-size: 10px;
  color: var(--muted);
  margin-top: 1px;
}

.gantt-days {
  display: flex;
  position: relative;
}

.gantt-cell {
  flex: 1;
  border-right: 0.5px solid var(--border);
  min-height: 52px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.gantt-cell.today { background: var(--today); }
.gantt-cell.weekend { background: rgba(255,255,255,0.015); }

.gantt-bar {
  position: absolute;
  left: 2px;
  right: 2px;
  height: 28px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  padding: 0 8px;
  font-size: 10px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  z-index: 2;
}

.gantt-bar:hover { opacity: 0.85; transform: scaleY(1.08); }

.gantt-bar.einsatz { background: var(--green-dim); color: var(--green); border: 1px solid rgba(63,185,80,0.3); }
.gantt-bar.urlaub  { background: var(--blue-dim);  color: var(--blue);  border: 1px solid rgba(88,166,255,0.3); }
.gantt-bar.krank   { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(248,81,73,0.3); }
.gantt-bar.aktiv   { background: rgba(63,185,80,0.25); color: var(--green); border: 1px solid var(--green); }

/* Heute-Linie */
.today-line {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--gold);
  z-index: 10;
  pointer-events: none;
}

.today-line::before {
  content: 'Heute';
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  color: var(--gold);
  font-weight: 700;
  white-space: nowrap;
  font-family: 'JetBrains Mono', monospace;
}

/* ── TOOLTIP ── */
.tooltip {
  position: fixed;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 12px;
  color: var(--text);
  pointer-events: none;
  z-index: 1000;
  max-width: 260px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  display: none;
}

.tooltip-title { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
.tooltip-row { display: flex; align-items: center; gap: 6px; color: var(--muted); margin-top: 3px; }
.tooltip-row span { color: var(--text); }

/* ── DETAIL PANEL ── */
.detail-panel {
  width: 300px;
  flex-shrink: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  display: none;
}

.detail-panel.open { display: block; }

.detail-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}

.detail-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--gold-dim);
  border: 2px solid var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 700;
  color: var(--gold);
  flex-shrink: 0;
}

.detail-name { font-size: 15px; font-weight: 700; }
.detail-sub  { font-size: 11px; color: var(--muted); margin-top: 2px; }

.detail-close {
  margin-left: auto;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: all 0.15s;
}

.detail-close:hover { color: var(--red); border-color: var(--red); }

.detail-body { padding: 16px; }

.detail-section { margin-bottom: 16px; }

.detail-sec-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--muted2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 8px;
}

.detail-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 8px 10px;
  background: var(--surface2);
  border-radius: 6px;
  margin-bottom: 4px;
  border-left: 3px solid transparent;
}

.detail-item.einsatz { border-left-color: var(--green); }
.detail-item.urlaub  { border-left-color: var(--blue); }
.detail-item.krank   { border-left-color: var(--red); }

.detail-item-icon { font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.detail-item-main { font-size: 12px; font-weight: 600; }
.detail-item-sub  { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* ── LEGEND ── */
.legend {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 20px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--muted);
  position: sticky;
  bottom: 0;
}

.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; }

/* ── LOADING ── */
.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 16px;
  color: var(--muted);
  font-size: 13px;
}

.loading-spinner {
  width: 32px;
  height: 32px;
  border: 2px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted2); }

/* ── PRINT ── */
@media print {
  .topbar, .sidebar, .legend, .detail-panel, .week-nav, .view-btns, .btn-icon { display: none !important; }
  body { background: white; color: black; }
  .gantt-wrap { overflow: visible; }
  .main { height: auto; }
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">
    <div class="logo-mark">GX</div>
    <div>
      <div class="logo-text">Gartenxclusiv</div>
      <div class="logo-sub">Einsatzplanung</div>
    </div>
  </div>

  <div class="topbar-sep"></div>

  <div class="week-nav">
    <button class="week-nav-btn" onclick="navigateWeeks(-2)" title="2 Wochen zurück">«</button>
    <button class="week-nav-btn" onclick="navigateWeeks(-1)" title="1 Woche zurück">‹</button>
    <div class="week-label" id="week-label">KW 00 · 2026</div>
    <button class="week-nav-btn" onclick="navigateWeeks(1)" title="1 Woche vor">›</button>
    <button class="week-nav-btn" onclick="navigateWeeks(2)" title="2 Wochen vor">»</button>
    <button class="week-nav-btn" onclick="goToToday()" title="Heute" style="font-size:11px;width:auto;padding:0 8px;color:var(--gold)">Heute</button>
  </div>

  <div class="view-btns">
    <button class="view-btn active" onclick="setView('2w')" id="btn-2w">2 Wochen</button>
    <button class="view-btn" onclick="setView('4w')" id="btn-4w">4 Wochen</button>
    <button class="view-btn" onclick="setView('8w')" id="btn-8w">8 Wochen</button>
  </div>

  <button class="btn-icon" onclick="refreshAll()">
    <span id="sync-indicator" class="sync-dot"></span>
    Sync
  </button>

  <button class="btn-icon" onclick="window.print()">
    🖨 Export
  </button>
</div>

<!-- STATS BAR -->
<div class="stats-bar" id="stats-bar">
  <div class="stat">
    <div class="stat-icon green">👷</div>
    <div>
      <div class="stat-val green" id="stat-aktiv">–</div>
      <div class="stat-label">Heute aktiv</div>
    </div>
  </div>
  <div class="stat">
    <div class="stat-icon green">📋</div>
    <div>
      <div class="stat-val green" id="stat-einsaetze">–</div>
      <div class="stat-label">Einsätze diese Woche</div>
    </div>
  </div>
  <div class="stat">
    <div class="stat-icon blue">✈️</div>
    <div>
      <div class="stat-val blue" id="stat-urlaub">–</div>
      <div class="stat-label">Im Urlaub</div>
    </div>
  </div>
  <div class="stat">
    <div class="stat-icon red">🤒</div>
    <div>
      <div class="stat-val red" id="stat-krank">–</div>
      <div class="stat-label">Krank gemeldet</div>
    </div>
  </div>
  <div class="stat">
    <div class="stat-icon gold">⏳</div>
    <div>
      <div class="stat-val gold" id="stat-pending">–</div>
      <div class="stat-label">Offene Freigaben</div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-section">Ansicht</div>
    <div class="filter-item active" onclick="filterBy('alle')" id="filter-alle">
      <div class="filter-dot" style="background:var(--muted2)"></div>
      Alle Mitarbeiter
      <span class="filter-count" id="fc-alle">0</span>
    </div>
    <div class="filter-item" onclick="filterBy('aktiv')" id="filter-aktiv">
      <div class="filter-dot" style="background:var(--green)"></div>
      Heute aktiv
      <span class="filter-count" id="fc-aktiv">0</span>
    </div>
    <div class="filter-item" onclick="filterBy('urlaub')" id="filter-urlaub">
      <div class="filter-dot" style="background:var(--blue)"></div>
      Im Urlaub
      <span class="filter-count" id="fc-urlaub">0</span>
    </div>

    <div class="sidebar-section" style="margin-top:8px">Baustellen</div>
    <div id="baustellen-list">
      <div style="padding:8px 16px;font-size:11px;color:var(--muted2)">Wird geladen…</div>
    </div>
  </div>

  <!-- GANTT -->
  <div class="gantt-wrap" id="gantt-wrap">
    <div class="gantt-container" id="gantt-container">
      <div class="loading" id="loading">
        <div class="loading-spinner"></div>
        <div>Daten werden geladen…</div>
      </div>
    </div>
  </div>

  <!-- DETAIL PANEL -->
  <div class="detail-panel" id="detail-panel">
    <div class="detail-header">
      <div class="detail-avatar" id="dp-avatar">–</div>
      <div>
        <div class="detail-name" id="dp-name">–</div>
        <div class="detail-sub" id="dp-sub">–</div>
      </div>
      <button class="detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-body" id="dp-body"></div>
  </div>

</div>

<!-- LEGEND -->
<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--green-dim);border:1px solid var(--green)"></div>Eingeplant (Trello)</div>
  <div class="legend-item"><div class="legend-dot" style="background:rgba(63,185,80,0.25);border:1px solid var(--green)"></div>Gestempelt</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--blue-dim);border:1px solid var(--blue)"></div>Urlaub</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--red-dim);border:1px solid var(--red)"></div>Krank</div>
  <div style="margin-left:auto;font-size:10px;color:var(--muted2)" id="last-sync">–</div>
</div>

<!-- TOOLTIP -->
<div class="tooltip" id="tooltip"></div>

<script>
// ============================================================
//  KONFIG
// ============================================================
// Nur die Apps Script URL hier — Trello-Zugangsdaten bleiben im Backend (Code.gs)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMel0O3XuZbUkZkAam7vRE-_vhCUNzTRt1amUXcyHDiw9tsr6N0y2J4xFlpRr5MLwS/exec";

// ============================================================
//  STATE
// ============================================================
let viewDays   = 14;          // 2w / 4w / 8w
let startOffset = 0;          // Wochen-Offset von heute
let activeFilter = 'alle';
let activeBaustelle = null;
let selectedWorker = null;

let workers     = [];
let allEntries  = [];
let urlaubData  = [];
let krankData   = [];
let trelloData  = [];         // [{name, datum, datumBis, mitarbeiter:[]}]

// ============================================================
//  DATUM-HELFER
// ============================================================
function today() { return new Date().toISOString().slice(0,10); }

function addDays(dateStr, n) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

function getMonday(offset=0) {
  const now = new Date();
  const dow = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (dow===0?6:dow-1) + offset*7);
  return monday.toISOString().slice(0,10);
}

function formatDate(ds) {
  const d = new Date(ds+'T12:00:00');
  return d.toLocaleDateString('de-DE',{day:'numeric',month:'short'});
}

function getKW(ds) {
  const d = new Date(ds+'T12:00:00');
  const jan4 = new Date(d.getFullYear(),0,4);
  const startOfWeek = new Date(jan4);
  startOfWeek.setDate(jan4.getDate() - (jan4.getDay()||7) + 1);
  const diff = d - startOfWeek;
  return Math.ceil((diff/86400000 + 1)/7);
}

function getDayName(ds) {
  return ['So','Mo','Di','Mi','Do','Fr','Sa'][new Date(ds+'T12:00:00').getDay()];
}

function isWeekend(ds) {
  const dow = new Date(ds+'T12:00:00').getDay();
  return dow===0||dow===6;
}

function initials(name) {
  return name.split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
}

// Tage-Array für aktuellen Zeitraum
function getDays() {
  const start = getMonday(startOffset);
  const days = [];
  for(let i=0; i<viewDays; i++) days.push(addDays(start, i));
  return days;
}

// ============================================================
//  DATEN LADEN
// ============================================================
async function refreshAll() {
  setSyncLoading(true);
  try {
    await Promise.all([
      loadWorkers(),
      loadEntries(),
      loadUrlaub(),
      loadKrank(),
      loadTrello()
    ]);
    renderAll();
    document.getElementById('last-sync').textContent = 'Zuletzt: ' + new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}) + ' Uhr';
  } catch(e) {
    console.error('Refresh error:', e);
  }
  setSyncLoading(false);
}

function setSyncLoading(on) {
  const dot = document.getElementById('sync-indicator');
  dot.style.background = on ? 'var(--amber)' : 'var(--green)';
  dot.style.boxShadow  = on ? '0 0 6px var(--amber)' : '0 0 6px var(--green)';
}

async function loadWorkers() {
  try {
    const r = await fetch(SCRIPT_URL+'?action=getWorkers');
    const d = await r.json();
    if(d.ok) workers = d.workers;
  } catch(e) {
    // Fallback
    workers = [{name:'Demo Mitarbeiter',pin:'0000'}];
  }
}

async function loadEntries() {
  try {
    const r = await fetch(SCRIPT_URL+'?action=getEntries&worker=alle&monat=alle');
    const d = await r.json();
    if(d.ok) allEntries = d.entries || [];
  } catch(e) { allEntries = []; }
}

async function loadUrlaub() {
  try {
    const r = await fetch(SCRIPT_URL+'?action=getUrlaub&worker=alle');
    const d = await r.json();
    if(d.ok) urlaubData = (d.urlaub||[]).filter(u=>u.status==='approved');
  } catch(e) { urlaubData = []; }
}

async function loadKrank() {
  try {
    const r = await fetch(SCRIPT_URL+'?action=getMedia&kategorie=krank&worker=alle');
    const d = await r.json();
    if(d.ok) krankData = d.medien || [];
  } catch(e) { krankData = []; }
}

async function loadTrello() {
  try {
    const url = `https://api.trello.com/1/boards/${TRELLO_BOARD}/cards?key=${TRELLO_KEY}&token=${TRELLO_TOKEN}&fields=name,desc,due,start,idList,idChecklists&checklists=all`;
    const r = await fetch(url);
    const cards = await r.json();

    const listsUrl = `https://api.trello.com/1/boards/${TRELLO_BOARD}/lists?key=${TRELLO_KEY}&token=${TRELLO_TOKEN}&fields=name`;
    const lists = await (await fetch(listsUrl)).json();
    const listMap = {};
    lists.forEach(l => listMap[l.id] = l.name);

    trelloData = [];
    cards.forEach(card => {
      if(!card.due) return;
      const dueDate   = card.due.slice(0,10);
      const startDate = card.start
        ? new Date(card.start).toISOString().slice(0,10)
        : dueDate;

      // Mitarbeiter aus Checkliste
      const mitarbeiter = [];
      if(card.checklists) {
        card.checklists.forEach(cl => {
          if(!cl.name) return;
          if(cl.name.toLowerCase().includes('mitarbeiter')) {
            cl.checkItems.forEach(item => {
              if(item.state==='complete' && item.name) {
                mitarbeiter.push(item.name.trim());
              }
            });
          }
        });
      }

      trelloData.push({
        id:          card.id,
        name:        card.name,
        datum:       startDate,
        datumBis:    dueDate,
        liste:       listMap[card.idList]||'–',
        beschreibung: card.desc||'',
        mitarbeiter
      });
    });
  } catch(e) {
    console.error('Trello error:', e);
    trelloData = [];
  }
}

// ============================================================
//  RENDER
// ============================================================
function renderAll() {
  updateStats();
  updateSidebar();
  renderGantt();
}

function updateStats() {
  const t = today();

  // Heute aktiv (gestempelt)
  const aktiv = new Set(allEntries.filter(e=>e.datum===t&&e.art==='Stempel').map(e=>e.worker));
  document.getElementById('stat-aktiv').textContent = aktiv.size;

  // Einsätze diese Woche
  const monday = getMonday(0);
  const sunday = addDays(monday, 6);
  const einsaetzeWoche = new Set();
  trelloData.forEach(e=>{
    if(e.datum<=sunday && (e.datumBis||e.datum)>=monday) {
      e.mitarbeiter.forEach(m=>einsaetzeWoche.add(m));
    }
  });
  document.getElementById('stat-einsaetze').textContent = einsaetzeWoche.size;

  // Urlaub heute
  const urlaubHeute = new Set(urlaubData.filter(u=>t>=u.von&&t<=u.bis).map(u=>u.worker));
  document.getElementById('stat-urlaub').textContent = urlaubHeute.size;

  // Krank heute
  const krankHeute = new Set(krankData.filter(k=>k.krankvon&&k.krankbis&&t>=k.krankvon&&t<=k.krankbis).map(k=>k.worker));
  document.getElementById('stat-krank').textContent = krankHeute.size;

  // Offene Freigaben
  const pending = allEntries.filter(e=>e.status==='pending').length;
  document.getElementById('stat-pending').textContent = pending;

  // Filter-Counts
  document.getElementById('fc-alle').textContent   = workers.length;
  document.getElementById('fc-aktiv').textContent  = aktiv.size;
  document.getElementById('fc-urlaub').textContent = urlaubHeute.size;
}

function updateSidebar() {
  // Baustellen aus Trello
  const baustellenMap = {};
  trelloData.forEach(e=>{
    if(!baustellenMap[e.name]) baustellenMap[e.name] = new Set();
    e.mitarbeiter.forEach(m=>baustellenMap[e.name].add(m));
  });

  const sorted = Object.entries(baustellenMap).sort((a,b)=>b[1].size-a[1].size).slice(0,12);
  const container = document.getElementById('baustellen-list');

  if(!sorted.length) {
    container.innerHTML = '<div style="padding:8px 16px;font-size:11px;color:var(--muted2)">Keine Einsätze</div>';
    return;
  }

  container.innerHTML = sorted.map(([name, workers])=>`
    <div class="filter-item ${activeBaustelle===name?'active':''}" onclick="filterByBaustelle('${name.replace(/'/g,"\\'")}')">
      <div class="filter-dot" style="background:var(--green)"></div>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px">${name}</span>
      <span class="filter-count">${workers.size}</span>
    </div>`).join('');
}

// ============================================================
//  GANTT RENDER
// ============================================================
function renderGantt() {
  const days = getDays();
  const t = today();

  // KW-Label aktualisieren
  const kw = getKW(days[0]);
  const kw2 = getKW(days[days.length-1]);
  const year = days[0].slice(0,4);
  document.getElementById('week-label').textContent =
    kw===kw2 ? `KW ${kw} · ${year}` : `KW ${kw}–${kw2} · ${year}`;

  // Mitarbeiter filtern
  let filteredWorkers = [...workers];

  if(activeFilter==='aktiv') {
    const aktiv = new Set(allEntries.filter(e=>e.datum===t&&e.art==='Stempel').map(e=>e.worker));
    filteredWorkers = filteredWorkers.filter(w=>aktiv.has(w.name));
  } else if(activeFilter==='urlaub') {
    const im_urlaub = new Set(urlaubData.filter(u=>t>=u.von&&t<=u.bis).map(u=>u.worker));
    filteredWorkers = filteredWorkers.filter(w=>im_urlaub.has(w.name));
  }

  if(activeBaustelle) {
    const card = trelloData.find(c=>c.name===activeBaustelle);
    if(card) {
      filteredWorkers = filteredWorkers.filter(w=>card.mitarbeiter.some(m=>m.toLowerCase().includes(w.name.toLowerCase().split(' ')[0])||w.name.toLowerCase().includes(m.toLowerCase().split(' ')[0])));
    }
  }

  // Grid-Template
  const nameCols = '180px';
  const dayCols  = `repeat(${days.length}, 1fr)`;
  const gridTemplate = `grid-template-columns: ${nameCols} ${dayCols}`;

  // Container aufbauen
  const container = document.getElementById('gantt-container');
  container.innerHTML = '';

  // ── Header ──
  const header = document.createElement('div');
  header.className = 'gantt-header';
  header.style.cssText = gridTemplate;

  const nameHead = document.createElement('div');
  nameHead.className = 'gantt-header-name';
  nameHead.textContent = 'Mitarbeiter';
  header.appendChild(nameHead);

  days.forEach(ds => {
    const cell = document.createElement('div');
    cell.className = 'gantt-day-header' + (ds===t?' today':'') + (isWeekend(ds)?' weekend':'');
    cell.innerHTML = `<div class="gantt-day-num">${parseInt(ds.slice(8))}</div><div class="gantt-day-name">${getDayName(ds)}</div>`;
    header.appendChild(cell);
  });
  container.appendChild(header);

  // ── Rows ──
  if(!filteredWorkers.length) {
    const empty = document.createElement('div');
    empty.style.cssText = 'padding:40px;text-align:center;color:var(--muted);font-size:13px';
    empty.textContent = 'Keine Mitarbeiter in dieser Ansicht';
    container.appendChild(empty);
    return;
  }

  filteredWorkers.forEach(worker => {
    const row = document.createElement('div');
    row.className = 'gantt-row' + (selectedWorker===worker.name?' highlighted':'');
    row.style.cssText = gridTemplate;

    // Name-Zelle
    const nameCell = document.createElement('div');
    nameCell.className = 'gantt-name';
    nameCell.onclick = () => openDetail(worker.name);

    // Wochenstunden berechnen
    const monday = getMonday(0);
    const sunday = addDays(monday, 6);
    const wocheH = allEntries
      .filter(e=>e.worker===worker.name&&e.datum>=monday&&e.datum<=sunday)
      .reduce((s,e)=>s+(parseFloat(e.netto)||0),0);

    nameCell.innerHTML = `
      <div class="gantt-avatar">${initials(worker.name)}</div>
      <div>
        <div class="gantt-name-text">${worker.name}</div>
        <div class="gantt-name-sub">${wocheH>0?wocheH.toFixed(1)+' h diese Woche':'–'}</div>
      </div>`;
    row.appendChild(nameCell);

    // Tag-Zellen — ALLE Einträge sammeln, dann Badge-Logik
    days.forEach(ds => {
      const cell = document.createElement('div');
      cell.className = 'gantt-cell' + (ds===t?' today':'') + (isWeekend(ds)?' weekend':'');

      // Alle Einträge für diesen Tag sammeln
      const tagesItems = [];

      // Krank (höchste Priorität)
      const krank = krankData.find(k=>k.worker===worker.name&&k.krankvon&&k.krankbis&&ds>=k.krankvon&&ds<=k.krankbis);
      if(krank) tagesItems.push({type:'krank',icon:'🤒',label:'Krank',rawLabel:'Krank',sub:formatDate(krank.krankvon)+' – '+formatDate(krank.krankbis),zeit:''});

      // Urlaub
      const urlaub = urlaubData.find(u=>u.worker===worker.name&&ds>=u.von&&ds<=u.bis);
      if(urlaub) tagesItems.push({type:'urlaub',icon:'✈',label:'Urlaub',rawLabel:'Urlaub',sub:formatDate(urlaub.von)+' – '+formatDate(urlaub.bis)+' · '+urlaub.tage+' Tage',zeit:''});

      // ALLE Trello-Einsätze (find → filter!)
      trelloData.filter(e=>{
        const start=e.datum,end=e.datumBis||e.datum;
        return ds>=start&&ds<=end&&e.mitarbeiter.some(m=>{
          const ml=m.toLowerCase(),wl=worker.name.toLowerCase();
          return ml.includes(wl.split(' ')[0])||wl.includes(ml.split(' ')[0]);
        });
      }).forEach(e=>{
        const zm=e.name.match(/^(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})\s*(.*)/);
        const rawLabel=zm?zm[3]||e.name:e.name;
        const zeit=zm?zm[1]+'–'+zm[2]:'';
        tagesItems.push({type:'einsatz',icon:'📋',label:(zeit?zeit+' ':'')+rawLabel,rawLabel,sub:e.liste,zeit});
      });

      // Gestempelt
      const eintrag = allEntries.find(e=>e.worker===worker.name&&e.datum===ds&&(e.status==='approved'||e.status==='auto'));
      if(eintrag) tagesItems.push({type:'aktiv',icon:'✓',label:eintrag.von+'–'+eintrag.bis,rawLabel:eintrag.proj.split(',')[0],sub:(+eintrag.netto).toFixed(1)+' h',zeit:eintrag.von+'–'+eintrag.bis});

      if(!tagesItems.length){ row.appendChild(cell); return; }

      // Ersten Eintrag als Hauptbalken
      const first = tagesItems[0];
      const bar = document.createElement('div');
      bar.className = 'gantt-bar ' + first.type;
      bar.style.cssText = 'position:relative;padding-right:'+(tagesItems.length>1?'28px':'8px');

      if(tagesItems.length === 1) {
        bar.textContent = first.label;
      } else {
        // Badge mit Anzahl weiterer Einträge
        bar.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:calc(100% - 4px)">${first.label}</span><span style="position:absolute;right:3px;top:50%;transform:translateY(-50%);background:rgba(0,0,0,0.45);border-radius:9px;padding:1px 5px;font-size:9px;font-weight:800;color:#fff">+${tagesItems.length-1}</span>`;
      }

      // Klick öffnet Tages-Detail
      const wName = worker.name;
      bar.onclick = ev => { ev.stopPropagation(); openDayDetail(wName, ds, tagesItems); };
      cell.onclick = () => openDayDetail(wName, ds, tagesItems);

      cell.appendChild(bar);
      row.appendChild(cell);
    });

    container.appendChild(row);
  });
}

// ============================================================
//  TOOLTIP
// ============================================================
function showTooltip(e, data) {
  const tip = document.getElementById('tooltip');
  tip.innerHTML = `<div class="tooltip-title">${data.title}</div>`+
    data.rows.filter(r=>r&&r[1]).map(r=>`<div class="tooltip-row">${r[0]}: <span>${r[1]}</span></div>`).join('');
  tip.style.display = 'block';
  moveTooltip(e);

  document.addEventListener('mousemove', moveTooltip, {once:false});
  document.addEventListener('click', hideTooltip, {once:true});
}

function moveTooltip(e) {
  const tip = document.getElementById('tooltip');
  if(tip.style.display==='none') return;
  const x = e.clientX+14, y = e.clientY-10;
  tip.style.left = Math.min(x, window.innerWidth-280)+'px';
  tip.style.top  = Math.min(y, window.innerHeight-120)+'px';
}

function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
  document.removeEventListener('mousemove', moveTooltip);
}

// ============================================================
//  DETAIL PANEL
// ============================================================
function openDetail(workerName) {
  selectedWorker = workerName;
  const panel = document.getElementById('detail-panel');
  panel.classList.add('open');

  document.getElementById('dp-avatar').textContent = initials(workerName);
  document.getElementById('dp-name').textContent   = workerName;

  const t = today();
  const monday = getMonday(0);
  const sunday = addDays(monday, 6);

  // Wochenstunden
  const wocheH = allEntries.filter(e=>e.worker===workerName&&e.datum>=monday&&e.datum<=sunday).reduce((s,e)=>s+(parseFloat(e.netto)||0),0);
  document.getElementById('dp-sub').textContent = wocheH>0?wocheH.toFixed(1)+' h diese Woche':'Keine Einträge diese Woche';

  // Einträge aufbauen
  const items = [];

  // Trello-Einsätze
  trelloData.filter(e=>{
    const start=e.datum,end=e.datumBis||e.datum;
    const inRange=start<=addDays(monday,13)&&end>=monday;
    return inRange&&e.mitarbeiter.some(m=>{
      const ml=m.toLowerCase(),wl=workerName.toLowerCase();
      return ml.includes(wl.split(' ')[0])||wl.includes(ml.split(' ')[0]);
    });
  }).forEach(e=>{
    const zeitMatch=e.name.match(/^(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})\s*(.*)/);
    const label=zeitMatch?zeitMatch[3]||e.name:e.name;
    const zeit=zeitMatch?zeitMatch[1]+'–'+zeitMatch[2]:'';
    items.push({type:'einsatz',icon:'📋',main:label,sub:(zeit?zeit+' Uhr · ':'')+formatDate(e.datum)+(e.datum!==e.datumBis?' – '+formatDate(e.datumBis):'')});
  });

  // Urlaub
  urlaubData.filter(u=>u.worker===workerName&&u.bis>=monday&&u.von<=addDays(monday,13)).forEach(u=>{
    items.push({type:'urlaub',icon:'✈️',main:'Urlaub',sub:formatDate(u.von)+' – '+formatDate(u.bis)+' · '+u.tage+' Tage'});
  });

  // Krank
  krankData.filter(k=>k.worker===workerName&&k.krankbis&&k.krankbis>=monday).forEach(k=>{
    items.push({type:'krank',icon:'🤒',main:'Krankmeldung',sub:formatDate(k.krankvon)+' – '+formatDate(k.krankbis)});
  });

  // Zeiteinträge diese Woche
  const wocheEntries = allEntries.filter(e=>e.worker===workerName&&e.datum>=monday&&e.datum<=sunday);

  const body = document.getElementById('dp-body');
  body.innerHTML = '';

  if(items.length) {
    const sec = document.createElement('div');
    sec.className = 'detail-section';
    sec.innerHTML = '<div class="detail-sec-label">Nächste 2 Wochen</div>'+
      items.map(i=>`<div class="detail-item ${i.type}"><div class="detail-item-icon">${i.icon}</div><div><div class="detail-item-main">${i.main}</div><div class="detail-item-sub">${i.sub}</div></div></div>`).join('');
    body.appendChild(sec);
  }

  if(wocheEntries.length) {
    const sec2 = document.createElement('div');
    sec2.className = 'detail-section';
    sec2.innerHTML = '<div class="detail-sec-label">Einträge diese Woche</div>'+
      wocheEntries.map(e=>`<div class="detail-item einsatz"><div class="detail-item-icon">⏱</div><div><div class="detail-item-main">${e.proj.split(',')[0]}</div><div class="detail-item-sub">${e.datum} · ${e.von}–${e.bis} · ${(+e.netto).toFixed(1)} h</div></div></div>`).join('');
    body.appendChild(sec2);
  }

  if(!items.length && !wocheEntries.length) {
    body.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:12px">Keine Daten für diesen Zeitraum</div>';
  }

  renderGantt(); // Highlight aktualisieren
}

// Tages-Detail: alle Einträge eines Tages im Detail-Panel
function openDayDetail(workerName, ds, tagesItems) {
  selectedWorker = workerName;
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('dp-avatar').textContent = initials(workerName);
  document.getElementById('dp-name').textContent   = workerName;

  const wochentag = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'][new Date(ds+'T12:00:00').getDay()];
  document.getElementById('dp-sub').textContent = wochentag+', '+formatDate(ds);

  const typeLabels = {einsatz:'Trello-Einsatz',urlaub:'Urlaub',krank:'Krankmeldung',aktiv:'Gestempelt'};
  const colors = {einsatz:'var(--green)',urlaub:'var(--blue)',krank:'var(--red)',aktiv:'var(--green)'};

  const body = document.getElementById('dp-body');
  body.innerHTML = `
    <div class="detail-section">
      <div class="detail-sec-label">${tagesItems.length} Eintrag${tagesItems.length>1?'e':''} · ${wochentag}</div>
      ${tagesItems.map(item=>`
        <div class="detail-item ${item.type}">
          <div class="detail-item-icon">${item.icon}</div>
          <div style="flex:1">
            <div class="detail-item-main">${item.rawLabel}</div>
            ${item.zeit?`<div class="detail-item-sub">🕐 ${item.zeit} Uhr</div>`:''}
            <div class="detail-item-sub">${item.sub}</div>
            <div style="font-size:9px;color:${colors[item.type]};margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em">${typeLabels[item.type]||''}</div>
          </div>
        </div>`).join('')}
    </div>
    <div style="margin-top:4px">
      <button onclick="openDetail('${workerName.replace(/'/g,"\\'")}')"
        style="width:100%;padding:9px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:11px;cursor:pointer;transition:all 0.15s"
        onmouseover="this.style.borderColor='var(--gold)';this.style.color='var(--gold)'"
        onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
        Gesamte Übersicht → ${workerName}
      </button>
    </div>`;

  renderGantt();
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  selectedWorker = null;
  renderGantt();
}

// ============================================================
//  NAVIGATION + FILTER
// ============================================================
function navigateWeeks(n) {
  startOffset += n;
  renderGantt();
}

function goToToday() {
  startOffset = 0;
  renderGantt();
}

function setView(v) {
  viewDays = v==='2w'?14:v==='4w'?28:56;
  ['2w','4w','8w'].forEach(b=>{
    document.getElementById('btn-'+b).classList.toggle('active', b===v);
  });
  renderGantt();
}

function filterBy(name) {
  activeFilter = name;
  activeBaustelle = null;
  ['alle','aktiv','urlaub'].forEach(f=>{
    document.getElementById('filter-'+f).classList.toggle('active', f===name);
  });
  renderGantt();
  updateSidebar();
}

function filterByBaustelle(name) {
  if(activeBaustelle===name) {
    activeBaustelle = null;
  } else {
    activeBaustelle = name;
    activeFilter = 'alle';
    ['alle','aktiv','urlaub'].forEach(f=>document.getElementById('filter-'+f).classList.remove('active'));
  }
  renderGantt();
  updateSidebar();
}
