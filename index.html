<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gartenxclusiv Zeiterfassung</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GX Zeiterfassung">
<style>
  /* Gartenxclusiv Farben: Dunkelgrün + Gold */
  :root{
    --gx-dark: #1a2e1a;
    --gx-green: #2d4a1e;
    --gx-mid: #4a7c35;
    --gx-light: #e8f0e0;
    --gx-gold: #c8a84b;
    --gx-gold-light: #f5ecd4;
    --gx-text: #1a1a1a;
    --gx-muted: #666;
    --gx-border: #d8d8cc;
    --gx-bg: #f7f5f0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--gx-bg);min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
  .app{width:100%;max-width:420px;min-height:100vh;background:#fff;display:flex;flex-direction:column}

  /* Topbar */
  .topbar{background:var(--gx-dark);padding:14px 16px 12px;display:flex;align-items:center;gap:12px;flex-shrink:0;border-bottom:2px solid var(--gx-gold)}
  .topbar-logo{width:36px;height:36px;border-radius:8px;background:var(--gx-gold);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--gx-dark);letter-spacing:-.5px;flex-shrink:0}
  .topbar-titles{flex:1}
  .topbar-title{color:#fff;font-size:15px;font-weight:700;line-height:1.2}
  .topbar-sub{color:var(--gx-gold);font-size:11px;letter-spacing:.04em}

  /* Views */
  .view{padding:16px;display:none;flex:1}
  .view.active{display:block}
  .section-label{font-size:11px;font-weight:700;color:var(--gx-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}

  /* Mitarbeiter-Grid */
  .worker-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .worker-btn{background:var(--gx-bg);border:1px solid var(--gx-border);border-radius:12px;padding:14px 8px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s}
  .worker-btn:active{background:var(--gx-light);border-color:var(--gx-mid)}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--gx-gold);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--gx-dark);margin:0 auto 8px}
  .wname{font-size:13px;font-weight:500;color:var(--gx-text)}

  /* PIN */
  .pin-center{text-align:center;padding-top:8px}
  .pin-avatar-big{width:56px;height:56px;border-radius:50%;background:var(--gx-gold);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--gx-dark);margin:0 auto 8px}
  .pin-name{font-size:17px;font-weight:700;color:var(--gx-text);margin-bottom:2px}
  .pin-display{display:flex;gap:14px;justify-content:center;margin:20px 0 18px}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--gx-border);background:none;transition:all .15s}
  .pin-dot.filled{background:var(--gx-green);border-color:var(--gx-green)}
  .numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
  .num-btn{background:var(--gx-bg);border:1px solid var(--gx-border);border-radius:12px;padding:18px;font-size:20px;font-weight:500;color:var(--gx-text);cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent;user-select:none}
  .num-btn:active{background:var(--gx-light);border-color:var(--gx-mid)}
  .num-btn.del{font-size:16px;color:var(--gx-muted)}
  .num-btn.empty{background:none;border-color:transparent;cursor:default}

  /* Nachrichten */
  .error-msg{background:#FCEBEB;border-radius:10px;padding:10px 14px;font-size:13px;color:#791F1F;text-align:center;margin-bottom:12px;display:none}
  .success-msg{background:var(--gx-light);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--gx-green);text-align:center;margin-bottom:12px;display:none;font-weight:500}

  /* Navigation */
  .back-btn{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--gx-muted);cursor:pointer;margin-bottom:16px;background:none;border:none;padding:0}
  .user-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .user-avatar{width:42px;height:42px;border-radius:50%;background:var(--gx-gold);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--gx-dark);flex-shrink:0}
  .user-name{font-size:16px;font-weight:700;color:var(--gx-text)}
  .user-date{font-size:13px;color:var(--gx-muted)}

  /* Tabs */
  .tab-bar{display:flex;border-bottom:2px solid var(--gx-border);margin-bottom:16px}
  .tab{flex:1;padding:11px 4px;font-size:13px;font-weight:500;color:var(--gx-muted);text-align:center;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;-webkit-tap-highlight-color:transparent}
  .tab.active{color:var(--gx-green);border-bottom-color:var(--gx-gold);font-weight:700}

  /* Stempel-Buttons */
  .stamp-btn{width:100%;padding:17px;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;-webkit-tap-highlight-color:transparent;letter-spacing:.02em}
  .stamp-btn.ein{background:var(--gx-green);color:#fff;border:2px solid var(--gx-mid)}
  .stamp-btn.aus{background:#6b1a1a;color:#fff;border:2px solid #8b2222}
  .stamp-btn:active{opacity:.85}

  /* Laufende Zeit */
  .running-row{display:flex;align-items:center;gap:10px;background:var(--gx-light);border-radius:12px;padding:12px 14px;margin-bottom:12px;border:1px solid #c5d9b0}
  .dot-live{width:9px;height:9px;border-radius:50%;background:var(--gx-mid);animation:blink 1.4s infinite;flex-shrink:0}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .elapsed{font-size:32px;font-weight:700;color:var(--gx-dark);font-variant-numeric:tabular-nums;text-align:center;margin:8px 0 14px;letter-spacing:.02em}

  /* Formular */
  .field{margin-bottom:14px}
  .field label{font-size:13px;color:var(--gx-muted);display:block;margin-bottom:5px;font-weight:500}
  .field input,.field select{width:100%;font-size:15px;padding:11px 12px;border:1px solid var(--gx-border);border-radius:10px;background:#fff;color:var(--gx-text);-webkit-appearance:none}
  .field input:focus,.field select:focus{outline:none;border-color:var(--gx-mid);box-shadow:0 0 0 3px rgba(74,124,53,.1)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .calc-box{background:var(--gx-gold-light);border:1px solid var(--gx-gold);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .calc-label{font-size:13px;color:var(--gx-muted);font-weight:500}
  .calc-val{font-size:22px;font-weight:700;color:var(--gx-green)}

  /* Speichern */
  .save-btn{width:100%;padding:15px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;border:none;background:var(--gx-green);color:#fff;-webkit-tap-highlight-color:transparent;letter-spacing:.02em}
  .save-btn:active{opacity:.85}

  /* Einträge */
  .entries-list{display:flex;flex-direction:column;gap:8px}
  .entry-row{background:var(--gx-bg);border:1px solid var(--gx-border);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:flex-start}
  .entry-main{font-size:14px;font-weight:600;color:var(--gx-text);margin-bottom:2px}
  .entry-sub{font-size:12px;color:var(--gx-muted)}
  .entry-h{font-size:16px;font-weight:700;color:var(--gx-green);white-space:nowrap}
  .badge{font-size:10px;padding:2px 7px;border-radius:5px;font-weight:700;display:inline-block;margin-top:3px}
  .badge-s{background:var(--gx-light);color:var(--gx-green)}
  .badge-m{background:var(--gx-gold-light);color:#7d4e00}
  .empty-hint{font-size:13px;color:#aaa;text-align:center;padding:24px 0}

  /* Statusbar */
  .status-bar{background:var(--gx-dark);padding:7px 16px;font-size:11px;color:#666;text-align:center;flex-shrink:0;border-top:1px solid #2a3a2a}
  .status-bar.ok{color:var(--gx-gold)}
  .status-bar.err{color:#e08080}
  .status-bar.loading{color:#aaa}
</style>
</head>
<body>
<div class="app">

<div class="topbar">
  <div class="topbar-logo">GX</div>
  <div class="topbar-titles">
    <div class="topbar-title">Gartenxclusiv</div>
    <div class="topbar-sub">ZEITERFASSUNG</div>
  </div>
</div>

<!-- Mitarbeiter wählen -->
<div class="view active" id="v-worker">
  <div style="padding-top:4px">
    <div class="section-label">Wer bist du?</div>
    <div class="worker-grid" id="worker-grid">
      <div style="font-size:13px;color:#aaa;text-align:center;padding:20px;grid-column:span 2">Wird geladen…</div>
    </div>
  </div>
</div>

<!-- PIN -->
<div class="view" id="v-pin">
  <button class="back-btn" onclick="goBack('v-worker')">← Zurück</button>
  <div class="pin-center">
    <div class="pin-avatar-big" id="pin-avatar"></div>
    <div class="pin-name" id="pin-name"></div>
    <div style="font-size:13px;color:var(--gx-muted);margin-top:2px">PIN eingeben</div>
  </div>
  <div class="pin-display">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div class="error-msg" id="pin-error">Falscher PIN. Nochmal versuchen.</div>
  <div class="numpad">
    <div class="num-btn" onclick="pinKey('1')">1</div><div class="num-btn" onclick="pinKey('2')">2</div><div class="num-btn" onclick="pinKey('3')">3</div>
    <div class="num-btn" onclick="pinKey('4')">4</div><div class="num-btn" onclick="pinKey('5')">5</div><div class="num-btn" onclick="pinKey('6')">6</div>
    <div class="num-btn" onclick="pinKey('7')">7</div><div class="num-btn" onclick="pinKey('8')">8</div><div class="num-btn" onclick="pinKey('9')">9</div>
    <div class="num-btn empty"></div><div class="num-btn" onclick="pinKey('0')">0</div>
    <div class="num-btn del" onclick="pinDel()">⌫</div>
  </div>
</div>

<!-- Hauptbereich -->
<div class="view" id="v-main">
  <div class="user-row">
    <div class="user-avatar" id="main-avatar"></div>
    <div style="flex:1">
      <div class="user-name" id="main-name"></div>
      <div class="user-date" id="main-date"></div>
    </div>
    <button class="back-btn" style="margin:0" onclick="goBack('v-worker')">Abmelden</button>
  </div>
  <div class="tab-bar">
    <div class="tab active" id="tab-stempel" onclick="switchTab('stempel')">⏱ Stempeln</div>
    <div class="tab" id="tab-manuell" onclick="switchTab('manuell')">✏️ Manuell</div>
    <div class="tab" id="tab-verlauf" onclick="switchTab('verlauf')">📋 Verlauf</div>
  </div>

  <!-- Stempeln -->
  <div id="tc-stempel">
    <div id="running-block" style="display:none">
      <div class="running-row"><div class="dot-live"></div><div style="font-size:14px;color:var(--gx-green);font-weight:600" id="running-label"></div></div>
      <div class="elapsed" id="elapsed">00:00:00</div>
    </div>
    <div class="field"><label>Baustelle / Projekt</label><select id="proj-stamp"></select></div>
    <div class="error-msg" id="stamp-err"></div>
    <div class="success-msg" id="stamp-ok">✓ Zeit gespeichert!</div>
    <button class="stamp-btn ein" id="btn-ein" onclick="einStempeln()">▶ Einloggen</button>
    <button class="stamp-btn aus" id="btn-aus" onclick="ausStempeln()" style="display:none">⏹ Ausloggen &amp; speichern</button>
  </div>

  <!-- Manuell -->
  <div id="tc-manuell" style="display:none">
    <div class="row2">
      <div class="field"><label>Von</label><input type="time" id="man-von" value="07:00"></div>
      <div class="field"><label>Bis</label><input type="time" id="man-bis" value="16:00"></div>
    </div>
    <div class="field"><label>Pause (Minuten)</label><input type="number" id="man-pause" value="30" min="0" max="180" step="5" inputmode="numeric"></div>
    <div class="calc-box">
      <span class="calc-label">Nettostunden</span>
      <span class="calc-val" id="calc-net">8,5 h</span>
    </div>
    <div class="field"><label>Datum</label><input type="date" id="man-datum"></div>
    <div class="field"><label>Baustelle / Projekt</label><select id="proj-man"></select></div>
    <div class="field"><label>Notiz (optional)</label><input type="text" id="man-notiz" placeholder="z.B. Krankenstand, Überstunden…"></div>
    <div class="error-msg" id="man-error">Bitte Von/Bis korrekt eingeben.</div>
    <div class="success-msg" id="man-ok">✓ Eintrag gespeichert!</div>
    <button class="save-btn" onclick="saveManual()">Eintrag speichern</button>
  </div>

  <!-- Verlauf -->
  <div id="tc-verlauf" style="display:none">
    <div class="entries-list" id="entries-list"></div>
  </div>
</div>

<div class="status-bar" id="status-bar">Verbinde…</div>
</div>

<script>
// ============================================================
//  *** HIER DIE GOOGLE APPS SCRIPT URL EINTRAGEN ***
// ============================================================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMel0O3XuZbUkZkAam7vRE-_vhCUNzTRt1amUXcyHDiw9tsr6N0y2J4xFlpRr5MLwS/exec";
// ============================================================

const PROJEKTE = [
  "Garten Müller, Leipzig",
  "Park Renovierung Südvorstadt",
  "Bepflanzung Neubau Lindenstr.",
  "Pflege Firmengelände Koch AG",
  "Wegebau Gohlis-Mitte"
];

const FALLBACK_WORKERS = [
  {name:"Max Bauer",pin:"1234"},{name:"Lisa Kern",pin:"2345"},
  {name:"Tom Vogel",pin:"3456"},{name:"Anna Schreiber",pin:"4567"},
  {name:"Klaus Müller",pin:"5678"},{name:"Sara Dietz",pin:"6789"},
  {name:"Jan Fischer",pin:"7890"},{name:"Mia Hoffmann",pin:"8901"},
  {name:"Erik Walter",pin:"9012"},{name:"Petra Lange",pin:"0123"},
  {name:"Ben Schmidt",pin:"1357"},{name:"Lena Braun",pin:"2468"},
  {name:"Nico Richter",pin:"1122"}
];

let currentWorker=null,pinInput='',stampStart=null,elapsedTimer=null,localEntries=[],workers=[];

function pad(n){return String(n).padStart(2,'0')}
function initials(n){return n.split(' ').map(x=>x[0]).join('')}
function timeToMin(t){const[h,m]=t.split(':').map(Number);return h*60+m}
function setStatus(msg,type=''){const b=document.getElementById('status-bar');b.textContent=msg;b.className='status-bar'+(type?' '+type:'');}

function fillProjekte(){
  ['proj-stamp','proj-man'].forEach(id=>{
    document.getElementById(id).innerHTML=PROJEKTE.map(p=>`<option>${p}</option>`).join('');
  });
}

async function loadWorkers(){
  fillProjekte();
  if(!SCRIPT_URL||SCRIPT_URL.includes('EURE_URL')){
    workers=FALLBACK_WORKERS;renderWorkerGrid();
    setStatus('Demo-Modus','err');return;
  }
  try{
    const r=await fetch(SCRIPT_URL+'?action=getWorkers');
    const d=await r.json();
    workers=d.ok&&d.workers.length>0?d.workers:FALLBACK_WORKERS;
    setStatus(d.ok?'Verbunden ✓':'Lokaler Modus',d.ok?'ok':'err');
  }catch{workers=FALLBACK_WORKERS;setStatus('Offline – lokaler Modus','err');}
  renderWorkerGrid();
}

function renderWorkerGrid(){
  document.getElementById('worker-grid').innerHTML=workers.map((_,i)=>`
    <div class="worker-btn" onclick="selectWorker(${i})">
      <div class="avatar">${initials(workers[i].name)}</div>
      <div class="wname">${workers[i].name}</div>
    </div>`).join('');
}

function showView(id){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goBack(to){pinInput='';updateDots();document.getElementById('pin-error').style.display='none';if(elapsedTimer){clearInterval(elapsedTimer);elapsedTimer=null;stampStart=null;}showView(to);}

function selectWorker(i){
  currentWorker=workers[i];pinInput='';updateDots();
  document.getElementById('pin-error').style.display='none';
  document.getElementById('pin-avatar').textContent=initials(currentWorker.name);
  document.getElementById('pin-name').textContent=currentWorker.name;
  showView('v-pin');
}
function updateDots(){for(let i=0;i<4;i++)document.getElementById('d'+i).classList.toggle('filled',i<pinInput.length);}
function pinKey(k){if(pinInput.length>=4)return;pinInput+=k;updateDots();document.getElementById('pin-error').style.display='none';if(pinInput.length===4)setTimeout(checkPin,150);}
function pinDel(){pinInput=pinInput.slice(0,-1);updateDots();}

async function checkPin(){
  if(currentWorker.pin){
    pinInput===currentWorker.pin?openMain():(document.getElementById('pin-error').style.display='block',pinInput='',updateDots());
    return;
  }
  try{
    const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'checkPin',worker:currentWorker.name,pin:pinInput})});
    const d=await r.json();
    d.ok?openMain():(document.getElementById('pin-error').style.display='block',pinInput='',updateDots());
  }catch{document.getElementById('pin-error').style.display='block';document.getElementById('pin-error').textContent='Verbindungsfehler.';pinInput='';updateDots();}
}

function openMain(){
  document.getElementById('main-avatar').textContent=initials(currentWorker.name);
  document.getElementById('main-name').textContent=currentWorker.name;
  const now=new Date();
  document.getElementById('main-date').textContent=now.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('man-datum').value=now.toISOString().slice(0,10);
  recalcManual();switchTab('stempel');showView('v-main');
}

function switchTab(name){
  ['stempel','manuell','verlauf'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===name);
    document.getElementById('tc-'+t).style.display=t===name?'block':'none';
  });
  if(name==='verlauf')renderEntries();
}

function einStempeln(){
  stampStart=Date.now();
  const now=new Date();
  document.getElementById('running-label').textContent=`Eingestempelt seit ${pad(now.getHours())}:${pad(now.getMinutes())} Uhr`;
  document.getElementById('running-block').style.display='block';
  document.getElementById('btn-ein').style.display='none';
  document.getElementById('btn-aus').style.display='flex';
  document.getElementById('stamp-ok').style.display='none';
  elapsedTimer=setInterval(()=>{const d=Math.floor((Date.now()-stampStart)/1000);document.getElementById('elapsed').textContent=`${pad(Math.floor(d/3600))}:${pad(Math.floor((d%3600)/60))}:${pad(d%60)}`;},1000);
}

async function ausStempeln(){
  clearInterval(elapsedTimer);elapsedTimer=null;
  const end=new Date(),start=new Date(stampStart);
  const diffMin=Math.round((end-start)/60000);
  const entry={worker:currentWorker.name,datum:start.toISOString().slice(0,10),von:`${pad(start.getHours())}:${pad(start.getMinutes())}`,bis:`${pad(end.getHours())}:${pad(end.getMinutes())}`,pause:0,netto:parseFloat((diffMin/60).toFixed(2)),proj:document.getElementById('proj-stamp').value,art:'Stempel',notiz:''};
  stampStart=null;
  document.getElementById('running-block').style.display='none';
  document.getElementById('btn-ein').style.display='flex';
  document.getElementById('btn-aus').style.display='none';
  document.getElementById('elapsed').textContent='00:00:00';
  await saveToSheets(entry);
}

function recalcManual(){
  const von=document.getElementById('man-von').value,bis=document.getElementById('man-bis').value,pause=parseInt(document.getElementById('man-pause').value)||0;
  if(von&&bis){const diff=timeToMin(bis)-timeToMin(von)-pause;document.getElementById('calc-net').textContent=diff>0?(diff/60).toFixed(1).replace('.',',')+' h':'– h';}
}
document.getElementById('man-von').addEventListener('input',recalcManual);
document.getElementById('man-bis').addEventListener('input',recalcManual);
document.getElementById('man-pause').addEventListener('input',recalcManual);

async function saveManual(){
  const von=document.getElementById('man-von').value,bis=document.getElementById('man-bis').value,pause=parseInt(document.getElementById('man-pause').value)||0,datum=document.getElementById('man-datum').value;
  document.getElementById('man-error').style.display='none';document.getElementById('man-ok').style.display='none';
  const diff=timeToMin(bis)-timeToMin(von)-pause;
  if(!von||!bis||diff<=0){document.getElementById('man-error').style.display='block';return;}
  const entry={worker:currentWorker.name,datum,von,bis,pause,netto:parseFloat((diff/60).toFixed(2)),proj:document.getElementById('proj-man').value,art:'Manuell',notiz:document.getElementById('man-notiz').value};
  const ok=await saveToSheets(entry);
  if(ok)document.getElementById('man-notiz').value='';
}

async function saveToSheets(entry){
  localEntries.push(entry);
  const okId=entry.art==='Stempel'?'stamp-ok':'man-ok';
  if(!SCRIPT_URL||SCRIPT_URL.includes('EURE_URL')){
    const el=document.getElementById(okId);el.style.display='block';setTimeout(()=>el.style.display='none',2500);
    setStatus('Demo – lokal gespeichert','loading');return true;
  }
  setStatus('Speichert…','loading');
  try{
    const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'saveEntry',entry})});
    const d=await r.json();
    if(d.ok){setStatus('In Google Sheets gespeichert ✓','ok');const el=document.getElementById(okId);el.style.display='block';setTimeout(()=>el.style.display='none',2500);return true;}
    else{setStatus('Fehler: '+d.error,'err');return false;}
  }catch{
    setStatus('Offline – lokal gespeichert','err');
    const el=document.getElementById(okId);el.style.display='block';setTimeout(()=>el.style.display='none',2500);return true;
  }
}

function renderEntries(){
  const list=document.getElementById('entries-list');
  const mine=localEntries.filter(e=>e.worker===currentWorker?.name).slice().reverse();
  if(!mine.length){list.innerHTML='<div class="empty-hint">Noch keine Einträge in dieser Sitzung</div>';return;}
  list.innerHTML=mine.map(e=>`
    <div class="entry-row">
      <div><div class="entry-main">${e.proj.split(',')[0]}</div><div class="entry-sub">${e.datum} · ${e.von}–${e.bis}${e.pause>0?' · Pause '+e.pause+' min':''}</div>${e.notiz?`<div class="entry-sub">${e.notiz}</div>`:''}<span class="badge ${e.art==='Stempel'?'badge-s':'badge-m'}">${e.art}</span></div>
      <div class="entry-h">${e.netto.toFixed(1).replace('.',',')} h</div>
    </div>`).join('');
}

loadWorkers();
</script>
</body>
</html>
